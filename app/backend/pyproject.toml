[build-system]
requires = ["setuptools>=75,<83", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-teach-backend"
version = "0.1.0"
description = "师范专业 AI 试讲台系统最小后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.30,<1",
  "SQLAlchemy[asyncio]>=2.0,<2.1",
  "aiomysql[rsa]>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pip>=24.3,<26",
  "pip-tools>=7.4,<8",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "setuptools>=75,<83",
  "wheel>=0.44,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "common", "common.*", "tools", "tools.*"]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "wheels"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

